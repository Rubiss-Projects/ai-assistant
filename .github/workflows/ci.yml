name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run build

  container-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag ai-assistant-runtime-test .
      - name: Verify shared-mode Codex runtime bundle
        run: |
          docker run --rm --entrypoint /bin/sh ai-assistant-runtime-test -c 'test -x /usr/local/lib/codex/bin/codex && test -x /usr/local/lib/codex/codex-resources/bwrap && test -x /usr/local/lib/codex/codex-resources/zsh/bin/zsh && test -x /usr/local/lib/codex/codex-path/rg && /usr/local/lib/codex/bin/codex --version'
          docker run --rm --entrypoint node -e AI_ASSISTANT_SECURITY_MODE=shared -e AI_ASSISTANT_WORKSPACE_ROOT=/data/workspaces -e CODEX_EXECUTABLE_PATH=/usr/local/lib/codex/bin/codex ai-assistant-runtime-test --input-type=module -e "import { codexClientOptions } from '/app/dist/src/providers/codex.js'; import fs from 'node:fs'; const tmp=fs.mkdtempSync('/tmp/codex-smoke-'); if (codexClientOptions(tmp).codexPathOverride !== '/usr/local/lib/codex/bin/codex') process.exit(1);"
          set +e
          SANDBOX_OUTPUT=$(docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /data:rw,nosuid,nodev,size=64m,uid=10001,gid=10001 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001 --entrypoint /usr/local/lib/codex/bin/codex ai-assistant-runtime-test sandbox -- /bin/true 2>&1)
          SANDBOX_STATUS=$?
          set -e
          echo "$SANDBOX_OUTPUT"
          if echo "$SANDBOX_OUTPUT" | grep -q 'bubblewrap is unavailable'; then exit 1; fi
          if [ "$SANDBOX_STATUS" -ne 0 ] && ! echo "$SANDBOX_OUTPUT" | grep -q 'No permissions to create a new namespace'; then exit "$SANDBOX_STATUS"; fi
          docker run --rm --privileged --tmpfs /data:rw,nosuid,nodev,size=64m,uid=10001,gid=10001 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001 --entrypoint /usr/local/lib/codex/bin/codex ai-assistant-runtime-test sandbox -- /bin/true
