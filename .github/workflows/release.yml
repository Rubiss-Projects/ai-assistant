name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.15). Created from default-branch HEAD if it doesn't exist yet."
        required: true

jobs:
  release:
    # Skip the push-triggered run when this workflow itself pushed the tag
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Only runs for manual dispatch. Create+push the tag only when it doesn't
      # already exist, so re-running on an existing tag is a no-op instead of a failure.
      - name: Create tag if missing (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="$RELEASE_TAG"
          if ! npx --no-install semver "$TAG" >/dev/null 2>&1 || \
             [[ ! "$TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]{0,126}$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally; skipping creation."
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; skipping creation."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Resolve tag name
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$PUSH_TAG"
          fi
          if ! npx --no-install semver "$TAG" >/dev/null 2>&1 || \
             [[ ! "$TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]{0,126}$ ]]; then
            echo "Release tag must be valid SemVer and Docker-compatible: $TAG" >&2
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out resolved tag
        id: release_commit
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          git checkout --detach "refs/tags/$RELEASE_TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install resolved release dependencies
        run: npm ci
      - run: npm test
      - run: npm run build

      - name: Set container image name
        id: image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.name }}
          build-args: |
            VERSION=${{ steps.tag.outputs.name }}
            REVISION=${{ steps.release_commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Create the GitHub Release for the tag. Skip cleanly if it already exists.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping."
          else
            RELEASE_ARGS=(--generate-notes --title "Release $TAG" --latest=false \
              --notes "Container image: \`${IMAGE_NAME}:${TAG}\` (linux/amd64 and linux/arm64)")
            if node -e 'process.exit(require("semver").prerelease(process.argv[1]) ? 0 : 1)' "$TAG"; then
              RELEASE_ARGS+=(--prerelease)
            fi
            gh release create "$TAG" "${RELEASE_ARGS[@]}"
          fi

  promote-latest:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: release-latest
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Determine latest release tag
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags origin
          RELEASE_TAGS=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease)
          LATEST_TAG=$(RELEASE_TAGS="$RELEASE_TAGS" node -e 'const semver = require("semver"); const dockerTag = /^v[0-9A-Za-z][0-9A-Za-z._-]{0,126}$/; const releases = JSON.parse(process.env.RELEASE_TAGS); const tags = releases.filter((release) => !release.isDraft && !release.isPrerelease).map((release) => release.tagName).filter((tag) => dockerTag.test(tag) && semver.valid(tag) && semver.prerelease(tag) === null); process.stdout.write(tags.sort(semver.rcompare)[0] ?? "")')
          if [ -z "$LATEST_TAG" ]; then
            echo "No completed release is eligible for latest promotion." >&2
            exit 1
          fi
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image to latest
        env:
          IMAGE_NAME: ${{ needs.release.outputs.image }}
          RELEASE_TAG: ${{ steps.promotion.outputs.tag }}
        run: docker buildx imagetools create --tag "$IMAGE_NAME:latest" "$IMAGE_NAME:$RELEASE_TAG"

      - name: Mark GitHub Release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.promotion.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --latest
